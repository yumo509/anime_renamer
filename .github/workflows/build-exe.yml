name: 打包Windows EXE

# 触发条件：1. 打v开头的标签时自动打包并发布；2. 可手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # 允许手动触发

permissions:
  contents: write  # 允许发布Release

jobs:
  build-windows:
    runs-on: windows-latest
    name: Windows 单文件EXE打包
    
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: 'x64'

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行 PyInstaller 打包
        run: |
          pyinstaller -F -c --clean --name "动漫批量重命名工具" anime_renamer.py

      - name: 打包产物为ZIP
        run: |
          Compress-Archive -Path dist\动漫批量重命名工具.exe -DestinationPath 动漫批量重命名工具_Windows_x64.zip

      - name: 上传构建产物（可在Actions页面下载）
        uses: actions/upload-artifact@v4
        with:
          name: 动漫批量重命名工具_EXE
          path: dist/动漫批量重命名工具.exe

      - name: 自动发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: 动漫批量重命名工具_Windows_x64.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
